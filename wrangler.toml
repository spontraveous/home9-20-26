name = "spontraveous"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Secrets (set these with `wrangler secret put`, do NOT put real values here):
#   BREVO_API_KEY  – your Brevo transactional/API key
#   BREVO_LIST_ID  – the numeric ID of the Brevo list to add signups to
